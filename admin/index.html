<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navyaa — Content</title>
  <style>
    body { font-family: 'DM Sans', Helvetica, Arial, sans-serif; }
  </style>
</head>
<body>
  <!-- Decap CMS (the actively-maintained fork of Netlify CMS).
       Pinned to an exact version rather than a floating range (the old
       "^3.3.3" let unpkg silently serve whatever the newest 3.x release
       was on every page load — it had already drifted to 3.16.0 with no
       warning). Bump this deliberately when you want to upgrade. -->
  <script src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"></script>

  <script>
    // ---------------------------------------------------------------
    // Navyaa Intelligence widget: an "Analyze with AI" panel that calls
    // our Netlify Function (which calls OpenAI) and shows suggestions
    // for the writer to read and apply themselves to the real fields
    // below (Pillar, Mood, Excerpt, Tags, Slug, Image prompt, etc). It
    // never writes those fields for you and nothing publishes
    // automatically — you always review and set them yourself before
    // hitting Publish.
    // ---------------------------------------------------------------
    var h = window.h; // Decap CMS exposes createElement as `h` via CreateReactClass/React under the hood

    function copyToClipboard(text) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function () {});
      }
    }

    // On a brand-new, not-yet-saved entry, Decap doesn't always sync your
    // typed values into this widget's `entry` prop in time for Analyze to
    // read them — even though the title/body are visibly filled in. As a
    // fallback, read the actual on-screen field directly by its label so
    // Analyze works before your first Save too.
    function getFieldValueByLabel(labelText) {
      var labels = Array.prototype.slice.call(document.querySelectorAll("label"));
      var label = labels.filter(function (l) {
        return l.textContent.trim().toLowerCase().indexOf(labelText.toLowerCase()) === 0;
      })[0];
      if (!label) return "";

      var forId = label.getAttribute("for");
      var el = forId ? document.getElementById(forId) : null;
      if (el) {
        if ("value" in el) return el.value || "";
        if (el.textContent) return el.textContent;
      }

      // Rich text / markdown editors: the labeled id doesn't land on a
      // real element, so look for a Slate editor or textarea near the label.
      var node = label.closest("div");
      for (var i = 0; i < 5 && node; i++) {
        var editable = node.querySelector('[data-slate-editor="true"], textarea');
        if (editable) return ("value" in editable ? editable.value : editable.textContent) || "";
        node = node.parentElement;
      }
      return "";
    }

    // Scroll a field into view and flash a highlight around it, so after
    // clicking Copy the writer's eye is drawn straight to where to paste
    // instead of having to hunt for it further down the form. Reuses the
    // same label-matching approach as getFieldValueByLabel, generalized to
    // any input/select/textarea (or, for list widgets like FAQ with no
    // single fixed field, the section label itself as the best anchor).
    function scrollToFieldByLabel(labelText) {
      var labels = Array.prototype.slice.call(document.querySelectorAll("label"));
      var label = labels.filter(function (l) {
        return l.textContent.trim().toLowerCase().indexOf(labelText.toLowerCase()) === 0;
      })[0];
      if (!label) return;

      var target = label;
      var forId = label.getAttribute("for");
      var el = forId ? document.getElementById(forId) : null;
      if (el) {
        target = el;
      } else {
        var node = label.closest("div");
        for (var i = 0; i < 5 && node; i++) {
          var editable = node.querySelector('[data-slate-editor="true"], textarea, select, input');
          if (editable) { target = editable; break; }
          node = node.parentElement;
        }
      }

      target.scrollIntoView({ behavior: "smooth", block: "center" });

      var prevOutline = target.style.outline;
      var prevShadow = target.style.boxShadow;
      var prevTransition = target.style.transition;
      target.style.transition = "outline 0.15s ease, box-shadow 0.15s ease";
      target.style.outline = "3px solid #6E3035";
      target.style.boxShadow = "0 0 0 4px rgba(110, 48, 53, 0.15)";
      setTimeout(function () {
        target.style.outline = prevOutline;
        target.style.boxShadow = prevShadow;
        target.style.transition = prevTransition;
      }, 1800);
    }

    var NavyaaAIControl = window.createClass({
      getInitialState: function () {
        return { loading: false, error: "", result: null, copied: "", linkInput: "" };
      },
      handleLinkInputChange: function (e) {
        this.setState({ linkInput: e.target.value });
      },
      analyze: function () {
        var self = this;
        var entry = this.props.entry;
        var title = (entry && entry.getIn(["data", "title"])) || "";
        var body = (entry && entry.getIn(["data", "body"])) || "";

        if (!title) title = getFieldValueByLabel("Title");
        if (!body) body = getFieldValueByLabel("Body");

        if (!title && !body) {
          self.setState({ error: "Write a title or some content first.", result: null });
          return;
        }

        // Writer-typed titles of existing posts to link to. Split on
        // newlines/commas; the function resolves each against the site's
        // real posts index, so a typo just comes back unresolved rather
        // than ever producing a wrong URL.
        var linkedTitles = (self.state.linkInput || "")
          .split(/[\n,]/)
          .map(function (s) { return s.trim(); })
          .filter(Boolean);

        self.setState({ loading: true, error: "", result: null, copied: "" });

        fetch("/api/ai-suggest", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ title: title, content: body, linked_titles: linkedTitles }),
        })
          .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
          .then(function (res) {
            if (!res.ok) {
              self.setState({ loading: false, error: res.data.error || "Request failed." });
              return;
            }
            self.setState({ loading: false, result: res.data });
            self.props.onChange(JSON.stringify(res.data));
          })
          .catch(function (err) {
            self.setState({ loading: false, error: "Request failed: " + err.message });
          });
      },
      copy: function (field, text, targetLabel) {
        copyToClipboard(text);
        var self = this;
        self.setState({ copied: field });
        if (targetLabel) scrollToFieldByLabel(targetLabel);
        setTimeout(function () { self.setState({ copied: "" }); }, 1500);
      },
      render: function () {
        var self = this;
        var state = this.state;
        var r = state.result;

        var box = { border: "1px solid #D8D1C8", borderRadius: "4px", padding: "16px", marginTop: "10px", background: "#F7F4EE", fontSize: "13px", lineHeight: "1.6" };
        var btn = { background: "#6E3035", color: "#F7F4EE", border: "none", borderRadius: "3px", padding: "10px 18px", fontSize: "13px", cursor: "pointer" };
        var copyBtn = { background: "none", color: "#6E3035", border: "1px solid #6E3035", borderRadius: "3px", padding: "2px 8px", fontSize: "11px", cursor: "pointer", marginLeft: "8px" };

        function copyButton(field, text, targetLabel) {
          if (!text) return null;
          return h("button", {
            type: "button",
            style: copyBtn,
            onClick: function () { self.copy(field, text, targetLabel); },
          }, state.copied === field ? "Copied" : "Copy");
        }

        function showButton(targetLabel) {
          return h("button", {
            type: "button",
            style: copyBtn,
            onClick: function () { scrollToFieldByLabel(targetLabel); },
          }, "Show field");
        }

        var linkInputStyle = {
          width: "100%", padding: "9px 11px", border: "1px solid #D8D1C8", borderRadius: "3px",
          fontSize: "13px", fontFamily: "inherit", marginBottom: "8px", minHeight: "54px",
          boxSizing: "border-box", resize: "vertical",
        };

        var children = [
          h("label", { key: "linklabel", style: { display: "block", fontSize: "12px", color: "#77736D", marginBottom: "4px" } },
            "Link to these existing posts (paste exact titles, one per line — optional)"
          ),
          h("textarea", {
            key: "linkinput",
            style: linkInputStyle,
            value: state.linkInput,
            placeholder: "Why People Pull Away in Relationships\nHow to Let Go of Someone You Still Love",
            onChange: this.handleLinkInputChange,
          }),
          h("button", { type: "button", style: btn, onClick: this.analyze, disabled: state.loading },
            state.loading ? "Analyzing…" : "Analyze with AI"
          ),
        ];

        if (state.error) {
          children.push(h("div", { style: { color: "#6E3035", marginTop: "8px", fontSize: "13px" } }, state.error));
        }

        if (r) {
          var sectionHeading = { fontWeight: 600, marginTop: "14px", marginBottom: "4px", display: "block" };

          var resultChildren = [
            h("div", { key: "cat" }, [h("strong", null, "Pillar: "), r.category || "—", r.category ? showButton("Pillar") : null]),
            h("div", { key: "mood" }, [h("strong", null, "Mood: "), r.mood || "—", r.secondary_mood ? " / " + r.secondary_mood : "", r.mood ? showButton("Mood") : null]),
            h("div", { key: "int" }, [h("strong", null, "Intensity: "), r.intensity != null ? r.intensity : "—", showButton("Emotional intensity")]),
            h("div", { key: "slug" }, [h("strong", null, "URL slug: "), r.slug || "—", copyButton("slug", r.slug, "URL slug")]),
            h("div", { key: "exc" }, [h("strong", null, "Excerpt: "), r.excerpt || "—", copyButton("excerpt", r.excerpt, "Excerpt")]),
            h("div", { key: "seo" }, [h("strong", null, "SEO title: "), r.seo_title || "—", copyButton("seo", r.seo_title, "SEO title")]),
            h("div", { key: "meta" }, [h("strong", null, "Meta description: "), r.meta_description || "—", copyButton("meta", r.meta_description, "Meta description")]),
            h("div", { key: "tags" }, [h("strong", null, "Tags: "), (r.tags || []).join(", ") || "—", (r.tags || []).length ? copyButton("tags", r.tags.join(", "), "Tags") : null]),
            h("div", { key: "quote" }, [h("strong", null, "Featured quote: "), r.featured_quote || "—", r.featured_quote ? copyButton("quote", r.featured_quote, "Featured quote") : null]),
            h("div", { key: "img", style: { marginTop: "8px" } }, [
              h("strong", null, "Image prompt: "),
              copyButton("image_prompt", r.image_prompt),
              h("div", { style: { marginTop: "4px", color: "#3A3733" } }, r.image_prompt || "—"),
            ]),
          ];

          // Cluster suggestion -- always rendered (including "None"), with
          // a highlighted background so it's impossible to scroll past
          // without noticing. Select widgets can't be pasted into, so this
          // is a manual-click instruction (with a Show field jump) rather
          // than an auto-fill.
          resultChildren.push(
            h("div", { key: "cluster", style: { marginTop: "8px", padding: "6px 10px", background: "#F0EAE3", borderLeft: "3px solid #6E3035" } }, [
              h("strong", null, "Cluster: "),
              r.cluster === "None" ? "None — this essay doesn't fit an existing cluster" : (r.cluster + (r.cluster_role ? " (" + r.cluster_role + ")" : "")),
              r.cluster !== "None" ? showButton("Cluster") : null,
              h("div", { style: { fontSize: "11px", color: "#77736D", marginTop: "2px" } }, "Select this in the Cluster / Cluster role fields below."),
            ])
          );

          if (r.key_takeaway) {
            resultChildren.push(
              h("div", { key: "takeaway", style: { marginTop: "10px" } }, [
                h("span", { style: sectionHeading }, "Key takeaway"),
                copyButton("key_takeaway", r.key_takeaway, "Key takeaway"),
                h("div", { style: { marginTop: "4px" } }, r.key_takeaway),
              ])
            );
          }

          if (r.h2_outline && r.h2_outline.length) {
            resultChildren.push(
              h("div", { key: "outline", style: { marginTop: "10px" } }, [
                h("span", { style: sectionHeading }, "Suggested section headings"),
                h("ol", { style: { margin: "4px 0 0", paddingLeft: "20px" } },
                  r.h2_outline.map(function (h2, i) { return h("li", { key: i }, h2); })
                ),
              ])
            );
          }

          if (r.faq && r.faq.length) {
            resultChildren.push(
              h("div", { key: "faq", style: { marginTop: "10px" } }, [
                h("span", { style: sectionHeading }, "Suggested FAQ"),
                h("div", null,
                  r.faq.map(function (item, i) {
                    return h("div", { key: i, style: { marginTop: "8px", paddingLeft: "8px", borderLeft: "2px solid #D8D1C8" } }, [
                      h("div", null, [h("strong", null, item.question), copyButton("faq_q_" + i, item.question, "FAQ")]),
                      h("div", { style: { marginTop: "2px" } }, [item.answer, copyButton("faq_a_" + i, item.answer, "FAQ")]),
                    ]);
                  })
                ),
                h("div", { style: { fontSize: "11px", color: "#77736D", marginTop: "6px" } },
                  "Click \"+ Add\" in the FAQ field below, then Copy each Question and Answer here into it, one pair per entry."
                ),
              ])
            );
          }

          if (r.link_placements && r.link_placements.length) {
            resultChildren.push(
              h("div", { key: "links", style: { marginTop: "10px" } }, [
                h("span", { style: sectionHeading }, "Suggested internal links (verified URLs)"),
                h("div", null,
                  r.link_placements.map(function (lp, i) {
                    var markdownLink = "[" + lp.title + "](" + lp.url + ")";
                    return h("div", { key: i, style: { marginTop: "6px", paddingLeft: "8px", borderLeft: "2px solid #D8D1C8" } }, [
                      h("div", null, [
                        h("strong", null, lp.title),
                        " → ",
                        h("code", { style: { fontSize: "11px" } }, lp.url),
                        copyButton("link_" + i, markdownLink, "Body"),
                      ]),
                      lp.suggested_sentence
                        ? h("div", { style: { fontStyle: "italic", marginTop: "2px" } }, "\"" + lp.suggested_sentence + "\"")
                        : null,
                      h("div", { style: { fontSize: "10px", color: "#9A968E", marginTop: "2px" } }, "Copy pastes: " + markdownLink),
                    ]);
                  })
                ),
              ])
            );
          }

          if (r.unresolved_link_titles && r.unresolved_link_titles.length) {
            resultChildren.push(
              h("div", { key: "unresolved", style: { marginTop: "10px", color: "#6E3035" } }, [
                h("strong", null, "Couldn't verify: "),
                r.unresolved_link_titles.join(", "),
                h("div", { style: { fontSize: "11px" } }, r.unresolved_link_note || "Check the exact title spelling."),
              ])
            );
          }

          if (r.link_index_error) {
            resultChildren.push(
              h("div", { key: "idxerr", style: { marginTop: "8px", fontSize: "11px", color: "#77736D" } }, r.link_index_error)
            );
          }

          resultChildren.push(
            h("div", { key: "note", style: { marginTop: "10px", color: "#77736D", fontStyle: "italic" } },
              "Copy whichever of these you agree with into the fields below. Nothing here is applied automatically."
            )
          );

          children.push(h("div", { style: box }, resultChildren));
        }

        return h("div", null, children);
      },
    });

    var NavyaaAIPreview = window.createClass({
      render: function () {
        return h("div", { style: { fontSize: "12px", color: "#77736D" } }, "AI suggestions (see the edit pane)");
      },
    });

    CMS.registerWidget("navyaa-ai", NavyaaAIControl, NavyaaAIPreview);

    CMS.init();
  </script>
</body>
</html>
